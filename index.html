<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لشمشومتي 💙</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(255,255,255,.95), rgba(221,245,255,.7) 35%, rgba(203,229,255,.95)),
        linear-gradient(135deg, #e8f8ff, #dcecff);
      color: #19324a;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .heart {
      position: absolute;
      bottom: -40px;
      font-size: 22px;
      opacity: .45;
      animation: float 8s linear infinite;
    }
    .heart:nth-child(1){left:8%;animation-delay:0s}
    .heart:nth-child(2){left:24%;animation-delay:2s}
    .heart:nth-child(3){left:43%;animation-delay:4s}
    .heart:nth-child(4){left:66%;animation-delay:1s}
    .heart:nth-child(5){left:84%;animation-delay:3s}
    @keyframes float {
      from { transform: translateY(0) rotate(0deg); opacity: 0; }
      15% { opacity: .5; }
      to { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(1050px, 92%);
      margin: auto;
      padding: 45px 0 55px;
    }
    .hero {
      text-align: center;
      padding: 42px 20px 30px;
      background: rgba(255,255,255,.62);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(54, 105, 145, .14);
      backdrop-filter: blur(10px);
    }
    .badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      background: #dff4ff;
      color: #36769c;
      font-size: 14px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 68px);
      color: #285b7d;
    }
    .message {
      font-size: clamp(20px, 3.5vw, 30px);
      font-weight: 700;
      margin: 16px auto 10px;
      color: #315c77;
    }
    .sub {
      max-width: 680px;
      margin: auto;
      line-height: 1.9;
      color: #587286;
      font-size: 17px;
    }
    .gallery-title {
      text-align: center;
      margin: 50px 0 20px;
      color: #285b7d;
      font-size: 30px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .card {
      background: white;
      padding: 9px;
      border-radius: 22px;
      box-shadow: 0 12px 35px rgba(50,90,120,.14);
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .card:hover {
      transform: translateY(-7px) rotate(-1deg);
      box-shadow: 0 18px 45px rgba(50,90,120,.2);
    }
    .card img {
      display: block;
      width: 100%;
      height: 420px;
      object-fit: cover;
      border-radius: 16px;
    }
    .footer {
      text-align: center;
      margin-top: 35px;
      color: #678295;
      font-size: 15px;
    }
    @media (max-width: 750px) {
      .gallery { grid-template-columns: 1fr; }
      .card img { height: auto; max-height: 620px; }
      .wrap { padding-top: 20px; }
    }
  </style>
</head>
<body>
  <div class="hearts">
    <div class="heart">💙</div><div class="heart">✨</div>
    <div class="heart">💙</div><div class="heart">🦋</div><div class="heart">💙</div>
  </div>

  <audio id="bgAudio" loop autoplay>
    <source src="https://docs.google.com/uc?export=download&id=186Ly4ZzSzgeuhBg-qx1f9EIfyl-l1qPR" type="audio/mp3">
  </audio>

  <main class="wrap">
    <section class="hero">
      <div class="badge">For my best friend ✨</div>
      <h1>متزعليش يا شمشومتي 💙</h1>
      <p class="message">أنا معاكي 🤍</p>
      <p class="sub">
        مهما كان اللي مضايقك، افتكري إنك مش لوحدك.
        الصفحة دي مخصوص علشان تبتسمي شوية وتفتكري إن في حد بيحب يشوفك مبسوطة دايمًا 🫶
      </p>
    </section>

    <h2 id="photos" class="gallery-title">أحلى شمشومتي 💙</h2>
    <section class="gallery">
      <div class="card"><img src="https://lh3.googleusercontent.com/d/1hpOrQMYYo34xClHyYBbqTTaPsgO0OdfY" alt="صورة شمشومتي 1"></div>
      <div class="card"><img src="https://lh3.googleusercontent.com/d/1lWM9VjgxWJaffHXr6ugvoBn2wzfnh4Bm" alt="صورة شمشومتي 2"></div>
      <div class="card"><img src="https://lh3.googleusercontent.com/d/1810guQyHs3gWTTf5v5puQdk9EW0tjXvq" alt="صورة شمشومتي 3"></div>
    </section>

    <div class="footer">Made with friendship & good vibes 💙✨</div>
  </main>

  <script>
    // محاولة تشغيل الصوت تلقائياً أو مع أول لمسة/ضغطة في الصفحة بسبب قيود المتصفحات
    window.addEventListener('DOMContentLoaded', () => {
      const audio = document.getElementById('bgAudio');
      audio.play().catch(() => {
        const playOnInteraction = () => {
          audio.play();
          document.removeEventListener('click', playOnInteraction);
          document.removeEventListener('touchstart', playOnInteraction);
        };
        document.addEventListener('click', playOnInteraction);
        document.addEventListener('touchstart', playOnInteraction);
      });
    });
  </script>
</body>
</html>
